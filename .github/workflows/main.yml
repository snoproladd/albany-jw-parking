name: Build & Deploy Node.js to Azure (ACR, main + testing)

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: albanyjwparkingacr
  REPO:     albanyjwparking

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set TAG_SUFFIX
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_SUFFIX=prod" >> "$GITHUB_ENV"
          else
            echo "TAG_SUFFIX=test" >> "$GITHUB_ENV"
          fi

      - name: Set ACR_LOGIN_SERVER
        run: echo "ACR_LOGIN_SERVER=${{ env.ACR_NAME }}.azurecr.io" >> "$GITHUB_ENV"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_WIF_CLIENTID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          ACR_PASS=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          docker login ${{ env.ACR_LOGIN_SERVER }} \
            --username ${{ env.ACR_NAME }} \
          --password "$ACR_PASS"

      - name: Build & Push Docker image
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ env.REPO }}

          docker pull "$IMAGE:${{ env.TAG_SUFFIX }}" || true

          docker build --pull \
            --cache-from "$IMAGE:${{ env.TAG_SUFFIX }}" \
            -t "$IMAGE:${{ env.TAG_SUFFIX }}-${{ github.sha }}" \
            -t "$IMAGE:${{ env.TAG_SUFFIX }}" \
            -t "$IMAGE:latest" .

          docker push "$IMAGE:${{ env.TAG_SUFFIX }}-${{ github.sha }}"
          docker push "$IMAGE:${{ env.TAG_SUFFIX }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ env.REPO }}:${{ env.TAG_SUFFIX }}-${{ github.sha }}
            az webapp config container set \
              --name albanyjwparking \
              --resource-group defaultresourcegroup-eus \
              --container-image-name "$IMAGE" \
              --container-registry-url "https://${{ env.ACR_LOGIN_SERVER }}"